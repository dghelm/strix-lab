schema_version: 1
id: hip-rocm10-gfx1151
source: strix-llama
generator: Ninja
build_type: Release
toolchain:
  mode: rocm
  prefixes:
    system: /usr
    rocm: /opt/rocm-10
  cmake: /usr/bin/cmake
  ninja: /usr/bin/ninja
  c_compiler: /opt/rocm-10/bin/amdclang
  cxx_compiler: /opt/rocm-10/bin/amdclang++
  hip_compiler: /opt/rocm-10/bin/amdclang++
  rocm_prefix: /opt/rocm-10
  path:
    - /opt/rocm-10/bin
    - /usr/bin
execution:
  jobs: 8
  timeouts:
    discovery_seconds: 30.0
    configure_seconds: 300.0
    build_seconds: 1800.0
    inspection_seconds: 30.0
    capability_seconds: 30.0
environment:
  path_lists:
    ROCM_PATH: /opt/rocm-10
    LD_LIBRARY_PATH: /opt/rocm-10/lib
  literals:
    SOURCE_DATE_EPOCH: "0"
cmake:
  GGML_HIP: true
  AMDGPU_TARGETS: gfx1151
  GGML_NATIVE: false
  BUILD_SHARED_LIBS: false
  CMAKE_HIP_COMPILER_ROCM_ROOT: /opt/rocm-10
targets:
  - llama-bench
  - llama-server
  - test-backend-ops
